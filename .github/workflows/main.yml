name: 'CI/CD'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install JSHint
        run: npm install jshint --global
      - name: Run Linter
        run: |
          find ./secondChance-backend ./sentiment -name node_modules -prune -o -name '*.js' -print | xargs jshint
          echo "Linted all the js files successfully"

  client_build:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Run build
        run: |
          cd secondChance-frontend
          npm install
          CI=false npm run build
          echo "Client-side build successfully"
